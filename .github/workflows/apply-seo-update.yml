name: Apply SEO update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-seo-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update website files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def update(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old[:100]!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          update('index.html', [
