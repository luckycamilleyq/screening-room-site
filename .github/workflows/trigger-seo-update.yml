name: Trigger SEO update

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  trigger:
    if: github.event.issue.title == '[automation] Apply SEO update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run embedded SEO update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-seo-update.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n      - name: Commit website update"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'embedded-seo-update.py', 'exec'))
          Path('.github/workflows/trigger-seo-update.yml').unlink()
          PY
      - name: Commit website update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve SEO metadata and page consistency"
          git push origin main
